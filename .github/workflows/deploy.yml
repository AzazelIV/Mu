name: Deploy generated MU Online WebAssembly to GitHub Pages

on:
  workflow_run:
    workflows: ["Build MU Online WebAssembly"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download generated browser files
        uses: actions/download-artifact@v4
        with:
          name: mu-online-web-pages
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify downloaded runtime
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html shell_login.js shell_login.wasm shell_login.data muserver.js muserver.wasm muserver.data; do
            test -s "site/$file" || { echo "Missing or empty generated file: site/$file"; exit 1; }
            ls -lh "site/$file"
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
