name: Build MU Online WebAssembly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/client/**"
      - "src/server/**"
      - "web/**"
      - ".github/workflows/build-web.yml"

permissions:
  contents: read

jobs:
  build-web:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source without broken generated LFS artifact
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Set up Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version
          cmake --version
          emcc --version

      - name: Validate required client inputs
        shell: pwsh
        run: |
          $required = @(
            "src/client/Client/Data",
            "src/client/Client/Config.ini",
            "src/client/m2-sources.txt",
            "src/server/Data"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Required build input is missing: $path"
            }
          }

      - name: Build browser client and regenerate shell_login.data
        shell: pwsh
        run: ./src/client/build.ps1 -RecompileAll

      - name: Build Solo server WebAssembly
        shell: pwsh
        run: ./src/server/build.ps1 -Clean

      - name: Verify deployed runtime files
        shell: pwsh
        run: |
          $required = @(
            "web/index.html",
            "web/shell_login.js",
            "web/shell_login.wasm",
            "web/shell_login.data",
            "web/muserver.js",
            "web/muserver.wasm",
            "web/muserver.data"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Build output missing: $path"
            }
            $item = Get-Item $path
            if ($item.Length -eq 0) {
              throw "Build output is empty: $path"
            }
            Write-Host "$path ($($item.Length) bytes)"
          }

      - name: Package web build
        shell: pwsh
        run: |
          Compress-Archive -Path web/* -DestinationPath mu-online-web-build.zip -Force
          Get-Item mu-online-web-build.zip | Format-List Name,Length

      - name: Upload package for download
        uses: actions/upload-artifact@v4
        with:
          name: mu-online-web-build
          path: mu-online-web-build.zip
          if-no-files-found: error
          retention-days: 14
